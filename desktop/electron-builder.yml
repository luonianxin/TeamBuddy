appId: cn.goteams.client
productName: TeamBuddy
asar: true

directories:
  output: ../dist/desktop

# 浏览器登录的回调协议：GoTeams 登录确认页通过 teamsboard://auth/callback 唤起客户端。
# 改动这里必须同步 desktop/main/deep-link.cjs 与 internal/cloud/browserlogin.go。
protocols:
  - name: TeamBuddy
    schemes:
      - teamsboard

files:
  - main/**/*
  - preload/**/*
  - shared/**/*
  - build/icon.png
  - build/icon-macos.png
  - build/icon-windows.png
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - package.json

win:
  icon: build/icon.ico
  target:
    - nsis
  # 保留历史发布资产名，确保旧版客户端仍能发现并升级到更名后的版本。
  artifactName: "TeamsBoard-windows-${arch}.${ext}"
  extraResources:
    - from: resources/backend
      to: backend
      filter:
        - client.exe

mac:
  icon: build/icon-macos.png
  target:
    - dmg
  category: public.app-category.developer-tools
  # 保留历史发布资产名，确保旧版客户端仍能发现并升级到更名后的版本。
  artifactName: "TeamsBoard-macos-${arch}.${ext}"
  extraResources:
    - from: resources/backend
      to: backend
      filter:
        - client

nsis:
  oneClick: false
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  # electron-builder 为开始菜单快捷方式写入与 Main 一致的 AppUserModelID，
  # Windows Toast 需要此安装身份；不要用复制出来的裸 exe 验收通知。
  createStartMenuShortcut: true
  shortcutName: TeamBuddy
